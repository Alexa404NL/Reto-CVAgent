services:
  - type: web
    name: agente-cv
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIM
        sync: false
      - key: SIMILARITY_THRESHOLD
        sync: false
      - key: GEMINI_MAX_OUTPUT_TOKENS
        sync: false
      - key: GEMINI_TIMEOUT_MS
        sync: false
      - key: DATABASE_URL_READONLY
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: SYSTEM_PROMPT_B64
        sync: false
      - key: DAILY_REQUEST_CAP
        sync: false
